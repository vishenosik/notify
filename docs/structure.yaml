# Project structure
# Each folder has a description and an optional sequence of nested folders.

root:
  description: Go module root. Contains build configuration, migrations, SQL queries, and entry points.

  children:
    cmd:
      description: Application entry points. Each service is a separate subdirectory with a single main.go.
      children:
        notify:
          description: Entry point for the notification service — gRPC server, HTTP health, and RabbitMQ push consumer. Contains di-container and application logic.

    pkg:
      description: Public reusable packages available for import from outside the module.
      children:
        logs:
          description: Structured logging wrapper around slog — dev/prod modes, ECS schema, trace ID integration.
        i18n:
          description: Localization bundle, Accept-Language matching, and HTTP middleware for translating API error messages.

    locales:
      description: Embedded go-i18n TOML catalogs (en/ru) for API error messages.

    internal:
      description: All application code, not importable from outside the module. Organized by onion-architecture layers.
      children:

        app:
          description: Application layer — use cases, orchestration of domain and infrastructure. Implements CQRS.
          children:

            command:
              description: Write-side — state-changing commands (Create, Update, Delete) with input and result DTOs.

            query:
              description: Read-side — read queries (GetById, GetAll) with parameters and result types.

            common:
              description: Application read models (Result/DTO) returned by use cases, without domain types.

            mapper:
              description: Mapping from domain entities to application Result/DTO.

            interfaces:
              description: Application service interfaces — ports for the transport layer and test mocks.
              children:
                mocks:
                  description: Generated testify mocks of application service ports (PushUseCase, ClientUseCase, APIKeyUseCase) produced by mockery for unit tests.

            services:
              description: Use-case implementations — idempotency, validation, repository calls, read-after-write.
              children:
                push:
                  description: Web Push subscription management and broker-driven notification delivery.
                client:
                  description: Caller-service registry use cases — create, list, delete services and rotate their API keys.
                apikey:
                  description: API key authentication — hash-at-rest lookup that resolves a raw key to a caller service.

        config:
          description: Application configuration — loading from env/flags, build metadata, environment.
          children:
            tags:
              description: Build-time ldflags variables — service name, git commit, branch, env.

        domain:
          description: Domain layer — core business logic. Does not depend on other layers, frameworks, or the database.
          children:

            entities:
              description: Domain entities and aggregates (ClientService, APIKey, PushSubscription), factories, validation, Validated* wrappers for writes.

            repositories:
              description: Repository and integration ports — persistence and delivery contracts (Push, ClientService, APIKey, PushSender, PushPublisher, Pinger) implemented by infrastructure.
              children:
                mocks:
                  description: Generated testify mocks of domain repository and integration ports produced by mockery for unit tests.

            xerrors:
              description: Domain error types and sentinel errors for business rule violations.

            identity:
              description: Authenticated caller-service identity stored in request context after API-key verification.

        infrastructure:
          description: Infrastructure layer — technical adapters (DB, external APIs). Implements domain interfaces.
          children:
            db:
              description: Database access and repository implementations.
              children:
                sqlc:
                  description: Generated sqlc code (do not edit manually) — type-safe SQL queries and database row models.
                postgres:
                  description: Repository adapters on pgx + sqlc — ClientService, APIKey, PushSubscription; domain ↔ DB mapping, read-after-write.
            integrations:
              description: Access to external APIs and integration implementations.
              children:
                webpush:
                  description: Web Push (VAPID) sender — delivers browser push notifications to stored subscriptions.
                rabbitmq:
                  description: RabbitMQ publisher and consumer — enqueue and consume push-send messages.

        interface:
          description: Delivery layer — interaction with the outside world (gRPC and HTTP health).
          children:
            api:
              description: Application API transport — gRPC server and HTTP health router.
              children:
                grpc:
                  description: gRPC transport — proto, generated stubs, interceptors, and handlers.
                  children:
                    proto:
                      description: Protobuf service definitions (.proto) — WebPush, ClientRegistry.
                    gen:
                      description: protoc-generated gRPC/protobuf code (do not edit manually).
                    mapper:
                      description: Mapping between protobuf types and application Result/DTO.
                rest:
                  description: HTTP handlers (Chi) — health check and build info only.
                  children:
                    dto:
                      description: HTTP request/response models and error DTOs, separated from domain and application layer.

    migrations:
      description: SQL schema migrations (goose) — caller services, API keys, and push subscriptions.

    sql:
      description: Source SQL queries for code generation via sqlc.
      children:
        queries:
          description: Named SQL queries by entity (client_services, api_keys, push_subscriptions).

    deploy:
      description: Docker images and compose files for local development and production deployment.
      children:
        postgres:
          description: PostgreSQL deployment assets.
          children:
            init:
              description: Init scripts for PostgreSQL container — user/database bootstrap.

    docs:
      description: Project documentation — specifications, API collections, diagrams.
      children:
        postman:
          description: Postman collection for manual API testing.
        specs:
          description: Architecture overview and feature specifications — README, DBML, dbdiagram at the specs root.
        src:
          description: Source diagrams and visual assets (Excalidraw).
