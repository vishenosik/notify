all: false
template: testify
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    local-prefix: github.com/vishenosik/notify
dir: '{{.InterfaceDir}}/mock'
filename: mocks.go
pkgname: mock
structname: '{{.Mock}}{{.InterfaceName}}'
recursive: false
packages:
  github.com/vishenosik/notify/internal/domain/repository:
    config:
      all: true
  github.com/vishenosik/notify/internal/app/interface:
    interfaces:
      PushUseCase:
      ClientUseCase:
      APIKeyUseCase:
